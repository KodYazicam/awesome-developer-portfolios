name: Link check

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/generate.mjs
      - name: Fail if unique table is stale
        run: git diff --exit-code README.md
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-concurrency 4 README.md CONTRIBUTING.md
          fail: false
